services:
  postgres:
    image: postgres:16-alpine
    container_name: leitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leitor
      POSTGRES_USER: leitor
      POSTGRES_PASSWORD: leitor
    ports:
      - "5432:5432"
    volumes:
      - leitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leitor -d leitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leitor-postgres-data:
