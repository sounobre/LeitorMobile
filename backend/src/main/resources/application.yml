spring:
  application:
    name: leitor-backend
  profiles:
    active: ollama
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leitor}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.0.104:5173}
  auth:
    email: ${APP_AUTH_EMAIL:voce@exemplo.com}
    password: ${APP_AUTH_PASSWORD:troque-esta-senha}
