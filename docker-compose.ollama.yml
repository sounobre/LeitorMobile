services:
  ollama:
    image: ollama/ollama:latest
    container_name: leitor-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - leitor-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  leitor-ollama-data:
